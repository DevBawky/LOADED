    <style>
      :root {
        color-scheme: dark;
        --ink: #090706;
        --panel: #15100c;
        --paper: #f2e8d5;

        --gold: #d7aa5b;
        --red: #c43b2f;

      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
      body {
        display: grid;
        place-items: center;
        color: var(--paper);
        font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
        background:
          radial-gradient(circle at 50% 35%, rgba(108, 48, 26, 0.2), transparent 35%),
          linear-gradient(145deg, #100b08 0%, #050403 68%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: -30%;
        z-index: 20;
        pointer-events: none;
        opacity: 0.035;
        background:
          repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.25) 4px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 7px);
        animation: film-grain 0.22s steps(2) infinite;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 19;
        pointer-events: none;
        background: radial-gradient(circle, transparent 52%, rgba(0,0,0,0.62) 100%);
        transition: opacity 0.5s ease;
      }
      body.is-playing::before { opacity: 0.012; }
      body.is-playing::after { opacity: 0.18; }

      #unity-container {
        position: relative;
        width: min(100vw, 960px);
        aspect-ratio: 960 / 600;
        overflow: hidden;
        background: #050403;
        box-shadow: 0 24px 90px rgba(0,0,0,0.66), 0 0 0 1px rgba(215,170,91,0.16);
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        background: #231F20;
        opacity: 0.24;
        filter: blur(4px) saturate(0.55);
        transition: opacity 0.65s ease, filter 0.65s ease;
      }
      #unity-canvas:focus,
      #unity-canvas:focus-visible {
        border: 0 !important;
        outline: none !important;
        box-shadow: none !important;
      }
      body.is-playing #unity-canvas { opacity: 1; filter: none; }

      #unity-loading,
      #unity-start-gate {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 28px;
        text-align: center;
        background:
          linear-gradient(rgba(7,5,4,0.84), rgba(7,5,4,0.94)),
          radial-gradient(circle at center, rgba(139,54,28,0.28), transparent 52%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #unity-loading.is-hidden,
      #unity-start-gate:not(.is-visible) { opacity: 0; visibility: hidden; pointer-events: none; }

      .loading-content { width: min(88vw, 560px); display: grid; justify-items: center; }
      .brand { color: var(--paper); font-family: Georgia, serif; font-size: clamp(42px, 8vw, 76px); font-weight: 900; letter-spacing: 0.12em; line-height: 1; text-shadow: 0 4px 0 #3b1712, 0 0 34px rgba(196,59,47,0.28); }
      .brand-rule { width: 76px; height: 2px; margin: 17px 0 22px; background: var(--gold); box-shadow: 0 0 16px rgba(215,170,91,0.52); }

      .cylinder { position: relative; width: 176px; height: 176px; margin: 18px 0 18px; }
      .cylinder-ring {
        position: absolute;
        inset: 10px;
        border: 3px solid #7c674b;
        border-radius: 50%;
        background: radial-gradient(circle, #2a2119 0 25%, #17110d 26% 58%, #35291e 59% 65%, #120d0a 66%);
        box-shadow: inset 0 0 24px #000, 0 12px 34px rgba(0,0,0,0.62), 0 0 0 1px #160e09;
        transform: rotate(0deg);
        transform-origin: 50% 50%;
        transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
        will-change: transform;
      }
      .cylinder-ring::after {
        content: "";
        position: absolute;
        inset: 50%;
        width: 24px;
        height: 24px;
        margin: -12px;
        border: 2px solid #96764d;
        border-radius: 50%;
        background: #0c0907;
        box-shadow: inset 0 0 6px #000;
      }
      .chamber {
        --angle: calc(var(--index) * 60deg);
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px;
        transform: rotate(var(--angle)) translateY(-55px);
        border: 2px solid #67533d;
        border-radius: 50%;
        background: #080605;
        box-shadow: inset 0 3px 8px #000;
      }
      .chamber::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.35);
        background: radial-gradient(circle at 35% 30%, #ffd98f 0 12%, #bf722a 25%, #5e2b17 67%, #1a0c08 70%);
        box-shadow: 0 0 0 2px #d8ad68, 0 0 20px rgba(215,170,91,0.72);
        transition: opacity 0.2s ease, transform 0.28s cubic-bezier(.2,.9,.2,1.25);
      }
      .chamber.is-loaded::after { opacity: 1; transform: scale(1); }
      .chamber.is-seating {
        border-color: #d7aa5b;
        box-shadow: inset 0 3px 8px #000, 0 0 18px rgba(215,170,91,0.7);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .tip { min-height: 62px; margin-top: 24px; padding: 12px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: #cdbfa8; font-size: 13px; line-height: 1.55; }
      .tip-label { display: block; margin-bottom: 3px; color: var(--red); font-size: 9px; font-weight: 800; letter-spacing: 0.24em; }

      .start-panel { display: grid; justify-items: center; width: min(88vw, 520px); }
      .ready-label { color: var(--gold); font-size: 11px; font-weight: 800; letter-spacing: 0.32em; }
      .ready-title { margin: 8px 0 5px; font-family: Georgia, serif; font-size: clamp(40px, 7vw, 68px); font-weight: 900; letter-spacing: 0.09em; }
      .ready-copy { margin: 0 0 28px; color: var(--muted); font-size: 14px; }

      .web-button {
        min-width: 184px;
        padding: 13px 20px;
        border: 1px solid #8b6a3f;
        background: linear-gradient(#2a1d14, #17100c);
        color: var(--paper);
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.035);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .web-button:hover { transform: translateY(-2px); border-color: var(--gold); background: linear-gradient(#3a2518, #1b110c); }
      .web-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
      .web-button.primary { border-color: #b34531; background: linear-gradient(#8d2b22, #4c1713); font-size: 15px; }

      #unity-controls { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      #unity-controls.is-visible { opacity: 1; pointer-events: auto; }
      #unity-controls .web-button { min-width: 0; padding: 8px 11px; border-color: rgba(215,170,91,0.42); background: rgba(16,11,8,0.82); font-size: 11px; }

      #unity-retry { display: none; margin-top: 16px; }
      #unity-loading.is-error #unity-retry { display: inline-block; }
      #unity-loading.is-error .cylinder { filter: grayscale(1); opacity: 0.42; }
      #unity-warning { position: absolute; left: 50%; top: 12px; z-index: 12; width: min(90%, 720px); transform: translateX(-50%); }
      #unity-warning > div { margin-bottom: 8px; padding: 10px 12px; border: 1px solid #b34531; background: rgba(67,18,14,0.96); color: #fff; font-size: 12px; }

      @keyframes film-grain {
        0% { transform: translate3d(-2%, 1%, 0); }
        50% { transform: translate3d(2%, -1%, 0); }
        100% { transform: translate3d(0, 2%, 0); }
      }
      @media (max-width: 720px), (max-height: 540px) {
        #unity-container { width: 100vw; height: 100vh; aspect-ratio: auto; box-shadow: none; }
        .brand { font-size: clamp(38px, 12vw, 60px); }
        .cylinder { width: 142px; height: 142px; margin-bottom: 15px; }
        .chamber { transform: rotate(var(--angle)) translateY(-43px); }
        .tip { margin-top: 18px; }
        #unity-fullscreen { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

      <section id="unity-loading" aria-live="polite">
        <div class="loading-content">
          <div class="brand">LOADED</div>
          <div class="brand-rule"></div>
          <div class="cylinder" role="progressbar" aria-label="실린더 장전 진행" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
            <div class="cylinder-ring">
              <span class="chamber" style="--index:0"></span>
              <span class="chamber" style="--index:1"></span>
              <span class="chamber" style="--index:2"></span>
              <span class="chamber" style="--index:3"></span>
              <span class="chamber" style="--index:4"></span>
              <span class="chamber" style="--index:5"></span>
            </div>
          </div>
          <span id="unity-progress-text" class="sr-only">실린더 장전 준비 중</span>
          <div class="tip">
            <span class="tip-label">TACTICAL NOTE</span>
            <span id="unity-tip-text">탄환은 나중에 장전한 순서부터 발사됩니다.</span>
          </div>
          <button id="unity-retry" class="web-button" type="button">다시 시도</button>
        </div>
      </section>

      <section id="unity-start-gate">
        <div class="start-panel">
          <div class="ready-label">CYLINDER READY</div>
          <div class="ready-title">LOADED</div>
          <p class="ready-copy">준비가 완료되었습니다.</p>
          <button id="unity-start" class="web-button primary" type="button">클릭하여 시작</button>
        </div>
      </section>

      <div id="unity-warning"></div>
      <div id="unity-controls">
        <button id="unity-fullscreen" class="web-button" type="button">전체 화면</button>
      </div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const startGate = document.querySelector("#unity-start-gate");
      const startButton = document.querySelector("#unity-start");
      const retryButton = document.querySelector("#unity-retry");
      const progressText = document.querySelector("#unity-progress-text");
      const cylinder = document.querySelector(".cylinder");
      const cylinderRing = document.querySelector(".cylinder-ring");
      const tipText = document.querySelector("#unity-tip-text");
      const chambers = Array.from(document.querySelectorAll(".chamber"));
      const controls = document.querySelector("#unity-controls");
      const fullscreenButton = document.querySelector("#unity-fullscreen");
      const tips = [
        "탄환은 나중에 장전한 순서부터 발사됩니다.",
        "행동을 시작하면 적도 바로 다음 행동을 수행합니다.",
        "발사 전에 방향과 사거리를 확인하세요.",
        "탄환 순서를 바꾸면 예상 피해도 달라집니다.",
        "적 아래의 행동 아이콘에서 다음 행동을 확인하세요."
      ];
      let unityInstance = null;
      let tipIndex = 0;
      let requestedChambers = 0;
      let loadedChambers = 0;
      let isLoadingChamber = false;
      let unityLoadComplete = false;
      let loadingPresentationComplete = false;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let tipTimer = setInterval(() => {
        tipIndex = (tipIndex + 1) % tips.length;
        tipText.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360 });
        tipText.textContent = tips[tipIndex];
      }, 3500);

      function unityShowBanner(message, type) {
        const warning = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.textContent = message;
        warning.appendChild(item);
        if (type !== "error") {
          setTimeout(() => item.remove(), 5000);
        }
      }

      function finishLoadingPresentation() {
        if (!unityLoadComplete || loadedChambers < chambers.length || isLoadingChamber || loadingPresentationComplete) return;

        loadingPresentationComplete = true;
        progressText.textContent = "실린더 장전 완료";
        loading.classList.add("is-ready");
        clearInterval(tipTimer);
        setTimeout(() => {
          loading.classList.add("is-hidden");
          startGate.classList.add("is-visible");
          startButton.focus();
        }, reduceMotion ? 20 : 760);
      }

      function loadNextChamber() {
        if (isLoadingChamber || loadedChambers >= requestedChambers) {
          finishLoadingPresentation();
          return;
        }

        isLoadingChamber = true;
        const rotationStep = loadedChambers + 1;
        const chamberIndex = (
          chambers.length - (rotationStep % chambers.length)
        ) % chambers.length;
        const rotationDelay = reduceMotion ? 0 : 280;
        cylinderRing.style.transform = `rotate(${rotationStep * 60}deg)`;
        progressText.textContent = `${rotationStep}번째 탄실 정렬 중`;

        setTimeout(() => {
          const chamber = chambers[chamberIndex];
          chamber.classList.add("is-seating");
          chamber.classList.add("is-loaded");
          chamber.classList.remove("is-seating");
          loadedChambers++;
          cylinder.setAttribute("aria-valuenow", String(loadedChambers));
          progressText.textContent = `탄환 ${loadedChambers}발 장전 완료`;
          isLoadingChamber = false;
          setTimeout(loadNextChamber, reduceMotion ? 0 : 70);
        }, rotationDelay);
      }

      function setProgress(progress) {
        const clamped = Math.max(0, Math.min(1, progress));
        const chamberProgress = Math.floor(clamped * chambers.length + 0.001);
        requestedChambers = Math.max(
          requestedChambers,
          clamped >= 0.999 ? chambers.length : chamberProgress
        );
        loadNextChamber();
      }

      function showLoadError(message) {
        loading.classList.add("is-error");
        progressText.textContent = "불러오기에 실패했습니다";
        clearInterval(tipTimer);
        tipText.textContent = "네트워크 연결을 확인한 뒤 다시 시도하세요.";
        unityShowBanner(String(message), "error");
      }

      function getAudioContext() {
        return window.WEBAudio && window.WEBAudio.audioContext
          ? window.WEBAudio.audioContext
          : null;
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/c9436687d510b4c83414d841a483f9d6.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/238f230cdbc3fc2c80daea799800b397.data.unityweb",
        frameworkUrl: buildUrl + "/9fb2f03ee24f38e36eea42374d72eb3b.framework.js.unityweb",
        codeUrl: buildUrl + "/d0d3c41821ca109a65b6c10e0ee3316d.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "LOADED",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true
      };

      config.cacheControl = (url) => {
        if (url === config.dataUrl || url === config.frameworkUrl || url === config.codeUrl) {
          return "immutable";
        }
        return "must-revalidate";
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1;
      }

      retryButton.onclick = () => location.reload();
      startButton.onclick = () => {
        const context = getAudioContext();
        if (context && context.resume) context.resume().catch(() => {});
        startGate.classList.remove("is-visible");
        controls.classList.add("is-visible");
        document.body.classList.add("is-playing");
        canvas.focus();
      };
      fullscreenButton.onclick = () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
      };

      const loader = document.createElement("script");
      loader.src = loaderUrl;
      loader.onload = () => {
        createUnityInstance(canvas, config, setProgress).then((instance) => {
          unityInstance = instance;
          unityLoadComplete = true;
          setProgress(1);
          finishLoadingPresentation();
        }).catch(showLoadError);
      };
      loader.onerror = () => showLoadError("게임 로더를 불러오지 못했습니다.");
      document.body.appendChild(loader);
    </script>
  </body>
